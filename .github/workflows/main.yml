name: generate animation

on:
  schedule:
    - cron: "0 */24 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Empty cells in deep black, activity rising from crimson into aged gold
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#E4C98A&color_dots=#0A0A0A,#35060B,#5C0A12,#8C6A2E,#C6A15B&color_dot_border=#1b1f230a
            dist/github-contribution-grid-snake-dark.svg?color_snake=#E4C98A&color_dots=#0A0A0A,#35060B,#5C0A12,#8C6A2E,#C6A15B&color_dot_border=#1b1f230a

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
